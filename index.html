<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jonny Firth</title>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <!-- Google Fonts: Inconsolata Light (200, 300) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inconsolata:wght@200;300;400&display=swap" rel="stylesheet">

  <style>
    /* RESET & VARS */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      /* Exact sRGB Conversions */
      --red: #E4393B;            /* sRGB 0.894 0.222 0.232 */
      --text-light: #FDEDED;     /* sRGB 0.994 0.927 0.926 */
      --dark-bg: #222222;
      --card-bg: #000000;
      
      --font-serif: "Big Caslon", "Book Antiqua", "Palatino Linotype", Georgia, serif;
      --font-mono: 'Inconsolata', monospace;
    }

    body {
      background-color: var(--dark-bg);
      color: var(--text-light);
      font-family: var(--font-mono);
      font-weight: 300;
      overflow-x: hidden;
    }

    /* TOP HEADER BAR */
    header {
      position: fixed;
      top: 0;
      width: 100%;
      background-color: var(--red);
      color: var(--text-light);
      padding: 0.8rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 50;
    }

    .logo {
      font-family: var(--font-serif);
      font-size: 2.2rem;
      line-height: 1;
      font-weight: 400;
      color: var(--text-light);
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 2rem;
    }

    nav a {
      color: var(--text-light);
      text-decoration: none;
      font-family: var(--font-mono);
      font-weight: 300;
      font-size: 0.95rem;
      transition: opacity 0.2s ease;
    }

    nav a:hover {
      opacity: 0.7;
    }

    /* HERO SECTION */
    .hero-banner {
      background-color: var(--red);
      padding-top: 5rem;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Central Polaroid Frame */
    .polaroid-frame {
      width: 320px;
      max-width: 80vw;
      background: #ffffff;
      padding: 1rem 1rem 3.5rem 1rem;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
      z-index: 1;
      transform: rotate(-1deg);
    }

    /* Polaroid Image Wrapper & Slideshow */
    .polaroid-img-wrapper {
      position: relative;
      width: 100%;
      height: 380px;
      overflow: hidden;
      background: #111;
    }

    .polaroid-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 1s ease-in-out;
    }

    .polaroid-slide.active {
      opacity: 1;
    }

    /* Big Caslon Title Container */
    .hero-title-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 2;
      pointer-events: none;
    }

    .hero-overlay-text {
      width: 90%;
      max-width: 1100px;
      font-family: var(--font-serif);
      font-size: clamp(2.5rem, 6.5vw, 5.5rem);
      line-height: 0.95;
      color: #000000;
      text-align: center;
      letter-spacing: -0.01em;
      font-weight: 400;
      will-change: transform;
    }

    /* WORK GRID SECTION */
    .content-container {
      padding: 4rem 1.5rem 6rem 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
      position: relative;
      z-index: 3;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(450px, 1fr));
      gap: 1.5rem;
    }

    /* Edgy Rounded Cards */
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      padding: 0.6rem;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card-img-wrapper {
      width: 100%;
      aspect-ratio: 4/3;
      border-radius: 4px;
      overflow: hidden;
      background-color: #111;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-meta {
      padding: 1rem 0.5rem 0.5rem 0.5rem;
      font-family: var(--font-mono);
      font-weight: 300;
    }

    .card-title {
      font-size: 1rem;
      color: var(--text-light);
      margin-bottom: 0.3rem;
      font-weight: 400;
    }

    .card-sub {
      font-size: 0.85rem;
      color: #888888;
    }

    /* FOOTER / INFO */
    footer {
      border-top: 1px solid #333;
      padding: 3rem 1.5rem;
      font-family: var(--font-mono);
      font-weight: 300;
      font-size: 0.9rem;
      color: #888;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    footer a {
      color: var(--text-light);
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
      .hero-overlay-text { font-size: 2.2rem; }
    }
  </style>
</head>
<body>

  <!-- STICKY TOP HEADER -->
  <header>
    <a href="#" class="logo">Jonny Firth</a>
    <nav>
      <a href="#about">Information</a>
      <a href="mailto:mail@jonnyfirth.com">Contact</a>
    </nav>
  </header>

  <!-- HERO BANNER -->
  <section class="hero-banner">
    <div class="polaroid-frame">
      <div class="polaroid-img-wrapper">
        <img class="polaroid-slide active" src="https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=800" alt="Studio Setup 1">
        <img class="polaroid-slide" src="https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?q=80&w=800" alt="Studio Setup 2">
        <img class="polaroid-slide" src="https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?q=80&w=800" alt="Studio Setup 3">
        <img class="polaroid-slide" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=800" alt="Studio Setup 4">
        <img class="polaroid-slide" src="https://images.unsplash.com/photo-1470225620780-dba8ba36b745?q=80&w=800" alt="Studio Setup 5">
      </div>
    </div>

    <div class="hero-title-wrapper">
      <h1 class="hero-overlay-text" id="heroText">
        producer / sound design & composer / audio & mixing engineer
      </h1>
    </div>
  </section>

  <!-- PORTFOLIO GRID -->
  <main class="content-container">
    <div class="grid" id="projectGrid">
      <!-- Projects published via CMS will render here automatically -->
    </div>
  </main>

  <!-- FOOTER / ABOUT -->
  <footer id="about">
    <div>
      <p>composition and sound design across music, film, tv, art</p>
      <p>@ Tileyard Studios in Kings Cross, London</p>
    </div>
    <div>
      <p>Contact: <a href="mailto:mail@jonnyfirth.com">mail@jonnyfirth.com</a></p>
    </div>
  </footer>

  <!-- POLAROID AUTOMATIC SLIDESHOW SCRIPT -->
  <script>
    const slides = document.querySelectorAll('.polaroid-slide');
    let currentSlide = 0;

    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }

    // Changes photo every 3.5 seconds
    setInterval(nextSlide, 3500);
  </script>

  <!-- SIMPLE DIRECT SCROLL SCRIPT -->
  <script>
    const heroText = document.getElementById('heroText');

    window.addEventListener('scroll', () => {
      const scrollPosition = window.scrollY;
      heroText.style.transform = `translateY(-${scrollPosition * 1.2}px)`;
    });
  </script>

  <!-- SCRIPT TO LOAD CMS PROJECTS -->
  <script>
    async function loadCMSProjects() {
      const grid = document.getElementById('projectGrid');
      
      try {
        const response = await fetch('https://api.github.com/repos/jonnyfirth/portfolio/contents/content/projects');
        const files = await response.json();

        if (Array.isArray(files)) {
          grid.innerHTML = ''; // Clear default state
          
          for (const file of files) {
            if (file.name.endsWith('.json')) {
              const res = await fetch(file.download_url);
              const data = await res.json();

              const card = document.createElement('article');
              card.className = 'card';
              card.innerHTML = `
                <div class="card-img-wrapper">
                  <img src="${data.image}" alt="${data.title}">
                </div>
                <div class="card-meta">
                  <div class="card-title">${data.title}</div>
                  <div class="card-sub">${data.category}</div>
                </div>
              `;
              grid.appendChild(card);
            }
          }
        }
      } catch (err) {
        console.log('No CMS projects loaded yet or rate limit reached:', err);
      }
    }

    loadCMSProjects();
  </script>

  <!-- NETLIFY IDENTITY REDIRECT SCRIPT -->
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", user => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
  
</body>
</html>
