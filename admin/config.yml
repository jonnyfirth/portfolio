backend:
  name: git-gateway
  branch: main
  show_preview_links: false # Disables unneeded live preview fetches

media_folder: "images/uploads"
public_folder: "/images/uploads"

# Prevents Decap from doing heavy media scans on startup
media_library:
  name: uploadcare
  config:
    publicKey: "demopublickey" # Or use default without scanning large repos

collections:
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    extension: "json"
    format: "json"
    create: true
    slug: "{{slug}}"
    identifier_field: "title"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Category / Year", name: "category", widget: "string" }
      - { label: "Project Image", name: "image", widget: "image", required: false }
      - { label: "Video URL / File", name: "video", widget: "string", required: false }
      - { label: "Project Link (URL)", name: "link", widget: "string", required: false }
      - { label: "Hide Project?", name: "hidden", widget: "boolean", default: false, required: false }
      - { label: "Sort Order", name: "order", widget: "number", value_type: "int", default: 99 }